---
- name: Check and remediate Windows Datadog Agent service
  hosts: all
  gather_facts: false

  vars:
    service_name: datadogagent

  tasks:
    - name: Gather Datadog Agent service info
      ansible.windows.win_service_info:
        name: "{{ service_name }}"
      register: datadog_service_info
      ignore_unreachable: true
      failed_when: false

    - name: End compliance check when service information could not be gathered
      ansible.builtin.meta: end_host
      when:
        - datadog_service_info.unreachable | default(false) or
          datadog_service_info.failed | default(false)

    - name: Fail if Datadog Agent service is missing
      ansible.builtin.fail:
        msg: "Datadog Agent service is missing"
      when:
        - not datadog_service_info.exists | default(false)

    - name: Start Datadog Agent service when it is stopped
      ansible.windows.win_service:
        name: "{{ service_name }}"
        state: started
        start_mode: auto
      when:
        - datadog_service_info.exists
        - datadog_service_info.services[0].state != "started"

    - name: Refresh Datadog Agent service info after remediation
      ansible.windows.win_service_info:
        name: "{{ service_name }}"
      register: datadog_remediation_info
      ignore_unreachable: true
      failed_when: false

    - name: End compliance check when service information could not be refreshed
      ansible.builtin.meta: end_host
      when:
        - datadog_remediation_info.unreachable | default(false) or
          datadog_remediation_info.failed | default(false)

    - name: Fail if Datadog Agent service is still not running
      ansible.builtin.fail:
        msg: "Datadog Agent service exists but could not be started"
      when:
        - datadog_remediation_info.exists | default(false)
        - datadog_remediation_info.services[0].state != "started"